<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheShubhmilan Enquiry Form</title>
</head>
<body>
  <!-- This file is used by Netlify's build-time parser to register the form for Netlify Forms. -->
  <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="enquiry" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="whatsapp" />
    <input type="text" name="weddingDate" />
    <input type="text" name="eventType" />
    <input type="text" name="invitationType" />
    <input type="text" name="guestCount" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
